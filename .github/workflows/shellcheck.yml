name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions — this workflow only reads repo contents.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA for supply-chain safety.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run ShellCheck
        run: shellcheck --severity=warning ./*.sh
